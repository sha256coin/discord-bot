name: Deploy S256 Discord Bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# Two deploys at once would restart the bot twice over each other.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The deploy key on the VPS can run one command only (see
      # ~/bin/deploy-discord-bot): git pull, npm install, pm2 restart. It gives
      # no shell and cannot write files. The server's host key is pinned here,
      # so nothing is trusted on first use.
      - name: Deploy
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "[$VPS_IP]:$VPS_PORT ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII/OT4+sIqEJ+rEWj/uNA781YNu7KbUowke84AuagHto" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_IP" deploy-bot
